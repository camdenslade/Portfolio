<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Heavy Outer Rounded Frame -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#090D16" stroke="#38BDF8" stroke-width="12" />

  <!-- Chunky Hexagonal C/G Monogram Trace (22px Stroke) -->
  <path d="M 360 160 
           L 256 100 
           L 152 160 
           L 152 352 
           L 256 412 
           L 360 352 
           L 360 256 
           L 256 256" 
        fill="none" 
        stroke="url(#cgGradient)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Internal Cross-Cut Graph Edges -->
  <line x1="152" y1="160" x2="256" y2="256" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" />
  <line x1="152" y1="352" x2="256" y2="256" stroke="#10B981" stroke-width="14" stroke-linecap="round" />

  <!-- Oversized Solid Graph Terminals (Nodes) -->
  <!-- Top Apex -->
  <circle cx="256" cy="100" r="18" fill="#38BDF8" />
  <!-- Upper Left -->
  <circle cx="152" cy="160" r="18" fill="#38BDF8" />
  <!-- Upper Right Open End -->
  <circle cx="360" cy="160" r="18" fill="#6366F1" />
  <!-- Lower Left -->
  <circle cx="152" cy="352" r="18" fill="#10B981" />
  <!-- Bottom Apex -->
  <circle cx="256" cy="412" r="18" fill="#10B981" />
  <!-- Lower Right Corner -->
  <circle cx="360" cy="352" r="18" fill="#10B981" />
  <!-- Target Center Node -->
  <circle cx="256" cy="256" r="26" fill="#FFFFFF" stroke="#090D16" stroke-width="6" />
</svg>
